# Fails where the page names a file by a stamp that no longer matches it, so a
# changed file cannot go out under the address of its last version.
# site/stamp.py says what a stamp is.

name: Stamps

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  stamps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Check the stamps
        run: python3 site/stamp.py --check
