<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440, height=1080" />
    <title>Previously, the film</title>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"
      integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2"
      crossorigin="anonymous"
    ></script>

    <!-- The page's own stylesheet, so the film takes its colors, its type and
         its components from where the page does: the browser frame and the
         fact chip are the page's, drawn larger. -->
    <link rel="stylesheet" href="site/site.css" />

    <!-- The cue sheet. Every moment that a sound and a picture share is stated
         here once: the scenes read it through assets/film.js, and
         soundtrack.py reads it out of this file to place the music and the
         effects. Seconds from the start of the film.

         The scenes are the compositions: the cube and the words around it,
         and the four faces of the cube that are scenes of their own. The parts
         are the story's, and the music's sections follow them. The dial is
         the word the cube steps round to as it is dialed. The turns are the
         cube's quarter turns, each from when it starts to when it locks, and
         the cube checks that the stabs, the captions and the systems lock
         where the cue sheet places them. -->
    <script id="cues" type="application/json">
      {
        "bpm": 120,
        "length": 32,
        "scenes": { "cube": 0, "copy": 0, "headline": 0, "terminal": 0, "workspace": 0, "browser": 0 },
        "parts": { "opening": 0, "headline": 8, "install": 12, "nothing": 16, "admin": 18, "systems": 24, "end": 26 },
        "crtOn": 0,
        "dial": { "word": "PREVIOUSLY", "from": 1.0, "to": 2.0 },
        "whooshes": [2.0, 2.5],
        "press": 4.0,
        "meet": 4.55,
        "turns": [[7.6, 8.0], [11.6, 12.0], [15.82, 16.0], [16.57, 16.75], [17.32, 17.5], [17.7, 18.0], [18.9, 19.2], [20.5, 20.8], [21.9, 22.2], [23.8, 24.0], [24.08, 24.25], [24.33, 24.5], [24.52, 24.625], [24.65, 24.75], [24.775, 24.875]],
        "strike": 9.5,
        "keys": [12.3, 12.3333, 12.3666, 12.4, 12.4333, 12.5, 12.5333, 12.5666, 12.6, 12.6333, 12.6666, 12.7333, 12.7666, 12.8, 12.8333, 12.8666, 12.9, 12.9666, 13.0333, 13.1, 13.1333, 13.1666, 13.2, 13.2333, 13.2666, 13.3, 13.3333, 13.3666, 13.4333, 13.4666, 13.5, 13.5666, 13.6, 13.6333, 13.6666, 13.7, 13.7333, 13.7666, 13.8, 13.8666, 13.9, 13.9333, 14, 14.0333, 14.1, 14.1333, 14.1666, 14.2],
        "enter": 14.3333,
        "banner": 14.5,
        "steps": [14.7, 14.95, 15.2],
        "done": 15.45,
        "stabs": [16.0, 16.75, 17.5],
        "windows": [18.15, 18.55, 22.95],
        "captions": [19.2, 20.8, 22.2],
        "systems": [24.0, 24.25, 24.5, 24.625, 24.75, 24.875],
        "facts": [25.0],
        "spin": [24.875, 26.0],
        "finale": 26.0,
        "crtOff": 31.45
      }
    </script>
    <script src="assets/film.js"></script>
    <script src="assets/parts.js"></script>

    <style>
      html,
      body {
        width: 1440px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        /* Outside the tube, which is what a CRT shows before it has warmed up
           and after it is switched off. */
        background: #000;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Everything the screen shows, which is what the power on and the power
         off open and close. */
      #tube {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      #tube > [data-composition-src] {
        position: absolute;
        inset: 0;
      }

      /* The NeXTSTEP workspace the cube stands on for the whole film, lit a
         little above its middle. */
      #ground,
      #lift {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      #ground {
        background: var(--next-desktop);
      }

      #lift {
        background: radial-gradient(ellipse 70% 60% at 50% 38%, rgb(255 255 255 / 7%), transparent 70%);
      }

      #beam,
      #dot {
        position: absolute;
        pointer-events: none;
        opacity: 0;
      }

      #beam {
        left: 0;
        top: 539px;
        width: 1440px;
        height: 3px;
        background: #fff;
        box-shadow: 0 0 18px 4px rgb(200 200 255 / 80%);
      }

      #dot {
        left: 708px;
        top: 528px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 30px 10px rgb(200 200 255 / 85%);
      }

      .name {
        margin: 0;
        font-size: 156px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1;
        color: var(--next-white);
      }

      .letter {
        display: inline-block;
      }

      .flash {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
      }

      /* One of the outlines a NeXTSTEP window opens through. */
      .outline {
        position: absolute;
        border: 1px solid rgb(255 255 255 / 85%);
        box-sizing: border-box;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="32" data-width="1440" data-height="1080">
      <div id="tube">
        <div id="ground"></div>
        <div id="lift"></div>

        <div id="slot-cube" data-composition-id="cube" data-composition-src="compositions/cube.html" data-start="0" data-duration="32" data-track-index="1" data-width="1440" data-height="1080"></div>
        <div id="slot-copy" data-composition-id="copy" data-composition-src="compositions/copy.html" data-start="0" data-duration="32" data-track-index="2" data-width="1440" data-height="1080"></div>
      </div>

      <div id="beam"></div>
      <div id="dot"></div>

      <audio id="music" src="assets/music.flac" data-start="0" data-duration="32" data-track-index="10" data-volume="1"></audio>
      <audio id="effects" src="assets/effects.flac" data-start="0" data-duration="32" data-track-index="11" data-volume="1"></audio>
    </div>

    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });

        // The scenes start where the cue sheet places them, and the film and
        // its two sound tracks end where it says, which is also how long
        // soundtrack.py makes the stems. check reports any that do not.
        window.FILM.checkSlots(document.getElementById("tube"));
        const ends = {
          "The film": Number(document.getElementById("root").dataset.duration),
          "The music track": Number(document.getElementById("music").dataset.duration),
          "The effects track": Number(document.getElementById("effects").dataset.duration),
        };
        for (const [part, end] of Object.entries(ends)) {
          if (end !== window.CUES.length) {
            console.error(`${part} ends at ${end} s in the markup, and the cue sheet says ${window.CUES.length} s.`);
          }
        }

        // The power coming on: a line across the middle, which opens upwards
        // and downwards into a picture that is too bright for a moment.
        const on = window.CUES.crtOn;
        tl.set("#tube", { clipPath: "inset(50% 50% 50% 50%)", filter: "brightness(1.6)" }, on);
        tl.fromTo("#beam", { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.18, ease: "expo.out" }, on);
        tl.to("#tube", { clipPath: "inset(49.7% 0% 49.7% 0%)", duration: 0.18, ease: "expo.out" }, on);
        tl.to("#tube", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.34, ease: "expo.out" }, on + 0.18);
        tl.to("#beam", { opacity: 0, duration: 0.25, ease: "power2.out" }, on + 0.18);
        tl.to("#tube", { filter: "brightness(1)", duration: 0.8, ease: "power2.out" }, on + 0.18);

        // The power going off: the picture flares, folds to a line, the line
        // to a point, and the point fades.
        const off = window.CUES.crtOff;
        tl.to("#tube", { filter: "brightness(2.2)", duration: 0.15, ease: "power2.in" }, off);
        tl.to("#tube", { clipPath: "inset(49.7% 0% 49.7% 0%)", duration: 0.17, ease: "power3.in" }, off);
        tl.set("#beam", { opacity: 1, scaleX: 1 }, off + 0.17);
        tl.set("#tube", { clipPath: "inset(50% 50% 50% 50%)" }, off + 0.17);
        tl.to("#beam", { scaleX: 0, duration: 0.12, ease: "power3.in" }, off + 0.17);
        tl.set("#beam", { opacity: 0 }, off + 0.29);
        tl.set("#dot", { opacity: 1, scale: 1 }, off + 0.29);
        tl.to("#dot", { opacity: 0, scale: 0, duration: 0.2, ease: "power2.in" }, off + 0.29);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
