  <head>

      integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2"
      crossorigin="anonymous"
    ></script>

    <!-- The page's own stylesheet, so the film takes its colors and its type
         from where the page does. -->
    <link rel="stylesheet" href="site/site.css" />

    <!-- The cue sheet. Every moment that a sound and a picture share is stated
         here once: the board reads it through assets/film.js, and
         soundtrack.py reads it out of this file to place the music and the
         effects. Seconds from the start of the film.

         The parts are the story's, and the music's sections follow them. The
         dial names the word that is dialed, a letter landing on the board
         with each key, and when the dialing starts and ends. The flips are
         the board's turns that no other cue names. Each runs
         between its two moments, and its third entry says how much of the
         board turns, which is how loud its clatter is. A flip that clears the
         board ends before the next words start to turn, because a module set
         twice keeps whichever change starts last. -->
    <script id="cues" type="application/json">
      {
        "bpm": 120,
        "length": 32,
        "scenes": { "board": 0 },
        "parts": { "opening": 0, "headline": 8, "install": 12, "nothing": 16, "admin": 18, "systems": 24, "end": 26 },
        "crtOn": 0,
        "dial": { "word": "PREVIOUSLY", "from": 1.0, "to": 2.0 },
        "press": 4.0,
        "meet": 4.55,
        "flips": {
          "wake": [0.3, 0.75, "board"],
          "pi": [2.0, 2.45, "block"],
          "next": [2.5, 2.95, "block"],
          "merge": [4.0, 4.55, "board"],
          "name": [5.55, 5.9, "word"],
          "clearMerge": [7.4, 7.7, "board"],
          "raspberryPi": [8.0, 8.3333, "word"],
          "boosts": [9.0, 9.18, "word"],
          "nextstep": [10.25, 10.52, "word"],
          "clearHeadline": [11.4, 11.7, "row"],
          "title": [12.0, 12.3, "word"],
          "clearStabs": [17.6, 17.8, "row"],
          "admin": [18.0, 18.4, "block"],
          "adminTitle": [18.05, 18.55, "row"],
          "clearAdmin": [23.35, 23.7, "board"],
          "departures": [23.95, 24.15, "word"],
          "end": [25.55, 26.0, "board"],
          "endName": [26.2, 26.5, "word"],
          "endUrl": [26.5, 26.8, "word"],
          "endClaim": [26.6, 26.95, "row"]
        },
        "strike": 9.5,
        "keys": [12.3, 12.3333, 12.3666, 12.4, 12.4333, 12.5, 12.5333, 12.5666, 12.6, 12.6333, 12.6666, 12.7333, 12.7666, 12.8, 12.8333, 12.8666, 12.9, 12.9666, 13.0333, 13.1, 13.1333, 13.1666, 13.2, 13.2333, 13.2666, 13.3, 13.3333, 13.3666, 13.4333, 13.4666, 13.5, 13.5666, 13.6, 13.6333, 13.6666, 13.7, 13.7333, 13.7666, 13.8, 13.8666, 13.9, 13.9333, 14, 14.0333, 14.1, 14.1333, 14.1666, 14.2],

    <script src="assets/film.js"></script>

    <style>
      html,
      body {
        width: 1440px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        /* Outside the tube, which is what a CRT shows before it has warmed up
           and after it is switched off. */
        background: #000;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Everything the screen shows, which is what the power on and the power
         off open and close. */
      #tube {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      #tube > [data-composition-src] {
        position: absolute;
        inset: 0;
      }

      #beam,
      #dot {
        position: absolute;
        pointer-events: none;
        opacity: 0;
      }

      #beam {
        left: 0;
        top: 539px;
        width: 1440px;
        height: 3px;
        background: #fff;
        box-shadow: 0 0 18px 4px rgb(200 200 255 / 80%);
      }

      #dot {
        left: 708px;
        top: 528px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 30px 10px rgb(200 200 255 / 85%);
      }

      .flash {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="32" data-width="1440" data-height="1080">
      <div id="tube">
        <div id="slot-board" data-composition-id="board" data-composition-src="compositions/board.html" data-start="0" data-duration="32" data-track-index="1" data-width="1440" data-height="1080"></div>
      </div>

      <div id="beam"></div>
      <div id="dot"></div>

      <audio id="music" src="assets/music.flac" data-start="0" data-duration="32" data-track-index="10" data-volume="1"></audio>
      <audio id="effects" src="assets/effects.flac" data-start="0" data-duration="32" data-track-index="11" data-volume="1"></audio>
    </div>

    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });

        // The board starts where the cue sheet places it, and the film and its
        // two sound tracks end where it says, which is also how long
        // soundtrack.py makes the stems. check reports any that do not.
        window.FILM.checkSlots(document.getElementById("tube"));
        const ends = {
          "The film": Number(document.getElementById("root").dataset.duration),
          "The music track": Number(document.getElementById("music").dataset.duration),
          "The effects track": Number(document.getElementById("effects").dataset.duration),
        };
        for (const [part, end] of Object.entries(ends)) {
          if (end !== window.CUES.length) {
            console.error(`${part} ends at ${end} s in the markup, and the cue sheet says ${window.CUES.length} s.`);
          }
        }

        // The power coming on: a line across the middle, which opens upwards
        // and downwards into a picture that is too bright for a moment.
        const on = window.CUES.crtOn;
        tl.set("#tube", { clipPath: "inset(50% 50% 50% 50%)", filter: "brightness(1.6)" }, on);
        tl.fromTo("#beam", { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.18, ease: "expo.out" }, on);
        tl.to("#tube", { clipPath: "inset(49.7% 0% 49.7% 0%)", duration: 0.18, ease: "expo.out" }, on);
        tl.to("#tube", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.34, ease: "expo.out" }, on + 0.18);
        tl.to("#beam", { opacity: 0, duration: 0.25, ease: "power2.out" }, on + 0.18);
        tl.to("#tube", { filter: "brightness(1)", duration: 0.8, ease: "power2.out" }, on + 0.18);

        // Once the picture is open the tube has no clip at all, and it gets
        // one back only as it switches off. A clip that shows everything still
        // counts as a clip for HyperFrames' check, which then probes every
        // element under it for whether it paints, at every moment it samples,
        // and never gets through a scene of thousands of elements.
        tl.set("#tube", { clipPath: "none" }, on + 0.18 + 0.34);

        // The power going off: the picture flares, folds to a line, the line
        // to a point, and the point fades.
        const off = window.CUES.crtOff;
        tl.set("#tube", { clipPath: "inset(0% 0% 0% 0%)" }, off);
        tl.to("#tube", { filter: "brightness(2.2)", duration: 0.15, ease: "power2.in" }, off);
        tl.to("#tube", { clipPath: "inset(49.7% 0% 49.7% 0%)", duration: 0.17, ease: "power3.in" }, off);
        tl.set("#beam", { opacity: 1, scaleX: 1 }, off + 0.17);
        tl.set("#tube", { clipPath: "inset(50% 50% 50% 50%)" }, off + 0.17);
        tl.to("#beam", { scaleX: 0, duration: 0.12, ease: "power3.in" }, off + 0.17);
        tl.set("#beam", { opacity: 0 }, off + 0.29);
        tl.set("#dot", { opacity: 1, scale: 1 }, off + 0.29);
        tl.to("#dot", { opacity: 0, scale: 0, duration: 0.2, ease: "power2.in" }, off + 0.29);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
