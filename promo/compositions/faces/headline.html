<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The cube's face: Raspberry Pi boots NeXTSTEP</title>
  </head>
  <body>
    <template>
      <style>
        #headline {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          text-align: center;
          font-family: var(--font);
          color: var(--next-white);
        }

        /* The headline, as the page sets it, sized to the face. */
        #headline .claim {
          margin: 0;
          font-size: 66px;
          font-weight: 700;
          letter-spacing: -0.03em;
          line-height: 1.14;
        }

        #headline .line {
          display: block;
        }

        #headline .word {
          display: inline-block;
          position: relative;
          opacity: 0;
        }

        /* The word the sentence nearly said, as the page sets it. */
        #headline-struck {
          font-style: italic;
        }

        #headline-strike {
          position: absolute;
          left: -4px;
          right: -4px;
          top: 56%;
          height: 7px;
          border-radius: 4px;
          background: var(--next-white);
          transform-origin: left center;
        }

        #headline-accent {
          text-shadow: 0 0 36px rgb(143 143 196 / 80%);
        }
      </style>

      <div id="headline" data-composition-id="headline" data-width="546" data-height="546">
        <p class="claim">
          <span class="line"><span id="headline-raspberry" class="word">Raspberry</span> <span id="headline-pi" class="word">Pi</span></span>
          <span class="line"><span id="headline-struck" class="word">boosts<span id="headline-strike"></span></span> <span id="headline-boots" class="word">boots</span></span>
          <span class="line"><span id="headline-accent" class="word">NeXTSTEP.</span></span>
        </p>
      </div>

      <script>
        (() => {
          const { tl, at, rise } = window.FILM.scene("headline");
          const cues = window.CUES;
          const start = cues.parts.headline;
          const BEAT = 60 / cues.bpm;

          // Raspberry Pi on the first beats, the word the sentence nearly says
          // on the third, struck on its cue, and what it says instead on the
          // downbeat of the second bar.
          const entries = {
            "#headline-raspberry": 0,
            "#headline-pi": BEAT / 2,
            "#headline-struck": 2 * BEAT,
            "#headline-boots": 4 * BEAT,
            "#headline-accent": 4.5 * BEAT,
          };
          for (const [word, offset] of Object.entries(entries)) rise(word, start + offset, 40);

          tl.fromTo("#headline-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power2.out" }, at(cues.strike));
          tl.to("#headline-struck", { color: window.FILM.token("--ink-soft"), duration: 0.3 }, at(cues.strike));
          tl.fromTo("#headline-accent", { scale: 1.25 }, { scale: 1, duration: 0.5, ease: "expo.out" }, at(start + entries["#headline-accent"]));

          window.__timelines["headline"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
