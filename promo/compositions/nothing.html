<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nothing but NeXTSTEP</title>
  </head>
  <body>
    <template>
      <style>
        #nothing {
          position: absolute;
          inset: 0;
          font-family: var(--font);
          color: var(--next-white);
        }

        #nothing .slam {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          margin: 0;
          font-size: 112px;
          font-weight: 800;
          letter-spacing: -0.04em;
          opacity: 0;
        }
      </style>

      <div id="nothing" data-composition-id="nothing" data-width="1440" data-height="1080">
        <p class="slam">No desktop.</p>
        <p class="slam">No login.</p>
        <p class="slam">Nothing but NeXTSTEP.</p>
      </div>

      <script>
        (() => {
          const { tl, at } = window.FILM.scene("nothing");
          const slams = document.querySelectorAll("#nothing .slam");

          // How much larger a line lands than it rests. The longest line is
          // about 1216 pixels wide at rest, so at this much larger it still
          // stands inside the 1440 of the picture.
          const PUNCH = 1.12;

          // Each one lands on its stab and holds until the next replaces it.
          window.CUES.stabs.forEach((filmTime, index) => {
            tl.set(slams[index], { opacity: 1 }, at(filmTime));
            tl.fromTo(slams[index], { scale: PUNCH, filter: "blur(8px)" }, { scale: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, at(filmTime));
            if (index > 0) tl.set(slams[index - 1], { opacity: 0 }, at(filmTime));
          });

          window.__timelines["nothing"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
