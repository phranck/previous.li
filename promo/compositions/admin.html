<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The admin</title>
  </head>
  <body>
    <template>
      <style>
        #admin {
          position: absolute;
          inset: 0;
          font-family: var(--font);
          color: var(--next-white);
        }

        /* The words above the windows, centered: the title on one line, and
           one caption at a time under it. */
        #admin-copy {
          position: absolute;
          left: 0;
          right: 0;
          top: 120px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 10px;
          text-align: center;
        }

        #admin-title {
          margin: 0;
          font-size: 56px;
          font-weight: 650;
          letter-spacing: -0.02em;
          line-height: 1.08;
        }

        #admin .captions {
          position: relative;
          width: 100%;
          height: 48px;
          margin: 0;
          padding: 0;
          list-style: none;
        }

        #admin .caption {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 14px;
          font-size: 34px;
          line-height: 1.2;
          opacity: 0;
        }

        #admin .caption .icon {
          width: 40px;
          height: 40px;
          padding: 7px;
          border-radius: 10px;
          background: rgb(255 255 255 / 14%);
        }

        /* What the camera looks at, faded out under the words, so a window
           the camera has come close to never runs into them. The fade stays
           where it is while the stage inside it moves. */
        #admin-view {
          position: absolute;
          inset: 0;
          mask-image: linear-gradient(to bottom, transparent 240px, #000 300px);
        }

        #admin-stage {
          position: absolute;
          left: 0;
          top: 0;
          width: 1440px;
          height: 1080px;
          transform-origin: 0 0;
        }

        /* The page's browser frame, holding the admin's desk at three
           quarters of its 1120 by 832. */
        #admin-browser {
          position: absolute;
          left: 300px;
          top: 312px;
          width: 840px;
          transform-origin: 50% 50%;
          opacity: 0;
        }

        #admin-browser .browser {
          width: 840px;
        }

        #admin-desk {
          display: block;
          width: 840px;
          height: 624px;
        }

        /* A window as site/shot.py takes it, at its own size in image
           pixels. Where it is and how large is all in its transform. */
        #admin .admin-window {
          position: absolute;
          left: 0;
          top: 0;
          display: block;
          max-width: none;
          transform-origin: 0 0;
          opacity: 0;
        }

        /* One of the outlines a window opens through. */
        #admin .admin-outline {
          position: absolute;
          left: 0;
          top: 0;
          border: 2px solid rgb(255 255 255 / 80%);
          box-sizing: border-box;
          opacity: 0;
        }
      </style>

      <div id="admin" data-composition-id="admin" data-width="1440" data-height="1080">
        <div id="admin-inner" class="fill">
          <div id="admin-view">
            <div id="admin-stage" data-layout-allow-overflow>
              <div id="admin-browser">
                <div class="browser">
                  <div class="browser__bar">
                    <div class="browser__lights" aria-hidden="true"><span></span><span></span><span></span></div>
                    <div class="browser__address">cube.local:8810</div>
                  </div>
                  <img id="admin-desk" src="assets/admin/desk.png" alt="" />
                </div>
              </div>
              <img id="window-files" class="admin-window" src="assets/admin/files.png" alt="" data-layout-allow-overflow />
              <img id="window-info" class="admin-window" src="assets/admin/info.png" alt="" data-layout-allow-overflow />
              <img id="window-pi" class="admin-window" src="assets/admin/pi.png" alt="" data-layout-allow-overflow />
            </div>
          </div>
          <div id="admin-copy">
            <p id="admin-title">A browser admin for Previous.</p>
            <ul class="captions">
              <li class="caption"><svg class="icon" aria-hidden="true"><use href="site/icons.svg#check"></use></svg>Original icons</li>
              <li class="caption"><svg class="icon" aria-hidden="true"><use href="site/icons.svg#check"></use></svg>Pixel exact</li>
              <li class="caption"><svg class="icon" aria-hidden="true"><use href="site/icons.svg#check"></use></svg>In your browser</li>
            </ul>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const { tl, at, rise } = window.FILM.scene("admin");
          const cues = window.CUES;
          const start = cues.scenes.admin;

          // site/shot.py takes a window with four image pixels a side to each
          // of NeXTSTEP's, so a picture over four is the window's own size.
          const IMAGE_PIXELS = 4;

          // Film pixels to a NeXTSTEP pixel while the windows float on the
          // workspace, and once they lie on the desk in the browser, which
          // shows the admin at its own zoom of 1.25 and the desk at three
          // quarters.
          const FLOATING = 1.3;
          const DOCKED = 1.25 * 0.75;

          // The desk's top left corner in the film: the browser frame's, below
          // the 40 pixel bar that site.css gives it.
          const DESK = { x: 300, y: 312 + 40 };

          // The windows, by the admin's names for them: their size in
          // NeXTSTEP pixels, where they float in the film, where they lie on
          // the desk in NeXTSTEP pixels, and when they open. Info opens on the
          // desk only, out of its item in the Workspace menu.
          const WINDOWS = {
            files: { size: [470, 480], floating: [175, 300], desk: [165, 170], opens: cues.windows[0] },
            info: { size: [400, 259], floating: [735, 335], desk: [420, 8], opens: cues.windows[1] },
            pi: { size: [360, 373], desk: [460, 250], opens: cues.windows[2] },
          };
          const INFO_MENU_ITEM = { x: 8, y: 50, width: 148, height: 19 };

          // A picture retaken at another size would be placed by the wrong
          // numbers above, so check is told.
          for (const [name, { size }] of Object.entries(WINDOWS)) {
            const picture = document.getElementById(`window-${name}`);
            picture
              .decode()
              .then(() => {
                const taken = [picture.naturalWidth / IMAGE_PIXELS, picture.naturalHeight / IMAGE_PIXELS];
                if (taken[0] !== size[0] || taken[1] !== size[1]) {
                  console.error(`assets/admin/${name}.png is ${taken.join(" by ")} NeXTSTEP pixels, and the scene places it as ${size.join(" by ")}.`);
                }
              })
              .catch(() => console.error(`assets/admin/${name}.png did not load.`));
          }

          // Where a window is, as a transform and as the rectangle it covers
          // in the film.
          const floating = (name) => ({ x: WINDOWS[name].floating[0], y: WINDOWS[name].floating[1], scale: FLOATING / IMAGE_PIXELS });
          const onTheDesk = ([x, y]) => ({ x: DESK.x + x * DOCKED, y: DESK.y + y * DOCKED, scale: DOCKED / IMAGE_PIXELS });
          const covered = (name, place) => ({
            x: place.x,
            y: place.y,
            width: (WINDOWS[name].size[0] * place.scale * IMAGE_PIXELS),
            height: (WINDOWS[name].size[1] * place.scale * IMAGE_PIXELS),
          });
          const pointIn = (name, [x, y]) => [WINDOWS[name].floating[0] + x * FLOATING, WINDOWS[name].floating[1] + y * FLOATING];

          // A window opening as NeXTSTEP opens one, and as the admin does:
          // eight outlines growing from where it was asked for to where it
          // will be, each drawn for a moment, and then the window itself.
          const OUTLINES = 8;
          const OUTLINE_STEP = 0.03;
          const OUTLINE_LIFE = 0.06;
          const stage = document.getElementById("admin-stage");
          const opening = (name, from, to, filmTime) => {
            for (let index = 1; index <= OUTLINES; index++) {
              const share = index / OUTLINES;
              const between = (key) => from[key] + (to[key] - from[key]) * share;
              const outline = document.createElement("div");
              outline.className = "admin-outline";
              stage.append(outline);
              const shown = filmTime + (index - 1) * OUTLINE_STEP;
              tl.set(outline, { opacity: 1, x: between("x"), y: between("y"), width: between("width"), height: between("height") }, at(shown));
              tl.set(outline, { opacity: 0 }, at(shown + OUTLINE_LIFE));
            }
            tl.set(`#window-${name}`, { opacity: 1 }, at(filmTime + OUTLINES * OUTLINE_STEP));
          };

          // A small rectangle in the middle of where a window will be, which
          // is where a window opened from nothing in particular starts.
          const middleOf = (rectangle) => ({
            x: rectangle.x + rectangle.width * 0.45,
            y: rectangle.y + rectangle.height * 0.45,
            width: rectangle.width * 0.1,
            height: rectangle.height * 0.1,
          });

          for (const name of ["files", "info"]) {
            tl.set(`#window-${name}`, floating(name), 0);
            opening(name, middleOf(covered(name, floating(name))), covered(name, floating(name)), WINDOWS[name].opens);
          }
          rise("#admin-title", start + 0.25, 30);

          // Where the camera stops: close on the File Viewer's applications,
          // then so close on the NeXTcube in the machine's window that each of
          // its pixels is eight of the film's, then back to the whole.
          // A stop puts its point in the middle of what the words leave free.
          const FOCUS = [720, 650];
          const stopOn = (zoom, [x, y]) => ({ scale: zoom, x: FOCUS[0] - zoom * x, y: FOCUS[1] - zoom * y });
          const ICONS = stopOn(2.0, pointIn("files", [215, 335]));
          const PIXELS = stopOn(8 / FLOATING, pointIn("info", [64.5, 63.5]));
          const WHOLE = { scale: 1, x: 0, y: 0 };

          // At the closest stop the window's corner sits on a whole film
          // pixel, so every NeXTSTEP pixel is the same eight by eight.
          const corner = [PIXELS.scale * WINDOWS.info.floating[0] + PIXELS.x, PIXELS.scale * WINDOWS.info.floating[1] + PIXELS.y];
          PIXELS.x += Math.round(corner[0]) - corner[0];
          PIXELS.y += Math.round(corner[1]) - corner[1];

          const CAMERA_EASE = "power3.inOut";
          const toIcons = { at: cues.captions[0] - 0.2, duration: 0.9 };
          const toPixels = { at: cues.captions[1] - 0.2, duration: 0.9 };
          const toWhole = { at: cues.captions[2] - 0.4, duration: 0.6 };
          tl.to("#admin-stage", { ...ICONS, duration: toIcons.duration, ease: CAMERA_EASE }, at(toIcons.at));
          tl.to("#admin-stage", { ...PIXELS, duration: toPixels.duration, ease: CAMERA_EASE }, at(toPixels.at));
          tl.to("#admin-stage", { ...WHOLE, duration: toWhole.duration, ease: CAMERA_EASE }, at(toWhole.at));

          // The machine's window is drawn with its pixels kept square for as
          // long as the camera is close enough to enlarge them, which is from
          // the moment one image pixel takes more than one film pixel. Further
          // out it is smoothed, because sampling it down without smoothing
          // would drop lines out of its text.
          const ENLARGED = IMAGE_PIXELS / FLOATING;
          const ease = gsap.parseEase(CAMERA_EASE);
          const whenScaleIs = (from, to, move, scale) => {
            let low = 0;
            let high = 1;
            for (let step = 0; step < 30; step++) {
              const middle = (low + high) / 2;
              const reached = from + (to - from) * ease(middle);
              if ((reached < scale) === (to > from)) low = middle;
              else high = middle;
            }
            return move.at + move.duration * low;
          };
          tl.set("#window-info", { imageRendering: "pixelated" }, at(whenScaleIs(ICONS.scale, PIXELS.scale, toPixels, ENLARGED)));
          tl.set("#window-info", { imageRendering: "auto" }, at(whenScaleIs(PIXELS.scale, WHOLE.scale, toWhole, ENLARGED)));

          // Into the browser: the frame comes up around the desk, the two
          // windows fly to where they lie on it, and Info opens out of the
          // Workspace menu.
          const docking = cues.captions[2] + 0.1;
          tl.fromTo("#admin-browser", { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, at(docking));
          ["files", "info"].forEach((name, index) => {
            tl.to(`#window-${name}`, { ...onTheDesk(WINDOWS[name].desk), duration: 0.7, ease: CAMERA_EASE }, at(docking + index * 0.06));
          });
          const menuItem = onTheDesk([INFO_MENU_ITEM.x, INFO_MENU_ITEM.y]);
          tl.set("#window-pi", onTheDesk(WINDOWS.pi.desk), 0);
          opening(
            "pi",
            { x: menuItem.x, y: menuItem.y, width: INFO_MENU_ITEM.width * DOCKED, height: INFO_MENU_ITEM.height * DOCKED },
            covered("pi", onTheDesk(WINDOWS.pi.desk)),
            WINDOWS.pi.opens,
          );

          // Each caption arrives as the camera reaches what it says, in the
          // place of the one before it.
          const captions = document.querySelectorAll("#admin .caption");
          cues.captions.forEach((filmTime, index) => {
            tl.fromTo(captions[index], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, at(filmTime));
            if (index > 0) tl.to(captions[index - 1], { opacity: 0, y: -16, duration: 0.25, ease: "power2.in" }, at(filmTime - 0.1));
          });

          tl.to("#admin-inner", { opacity: 0, filter: "blur(12px)", duration: 0.35, ease: "power2.in" }, at(cues.scenes.systems - 0.4));

          window.__timelines["admin"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
