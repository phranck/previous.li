<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The six systems</title>
  </head>
  <body>
    <template>
      <style>
        #systems {
          position: absolute;
          inset: 0;
          font-family: var(--font);
          color: var(--ink);
        }

        #roll {
          height: 170px;
          overflow: hidden;
          opacity: 0;
        }

        #roll p {
          margin: 0;
          height: 170px;
          font-size: 140px;
          font-weight: 700;
          letter-spacing: -0.03em;
          line-height: 170px;
        }

        /* The page's fact chips, drawn at twice the page's size. */
        #systems .hero__facts {
          gap: 16px;
          margin-top: 56px;
          font-size: 30px;
        }

        #systems .hero__fact {
          padding-inline: 32px;
          line-height: 64px;
          border-width: 2px;
          border-radius: 32px;
          opacity: 0;
        }
      </style>

      <div id="systems" data-composition-id="systems" data-width="1920" data-height="1080">
        <div class="center">
          <div id="roll">
            <div id="roll-strip" data-layout-allow-overflow>
              <p>NeXTSTEP 2.2</p>
              <p>NeXTSTEP 3.0</p>
              <p>NeXTSTEP 3.2</p>
              <p>NeXTSTEP 3.3</p>
              <p>OPENSTEP 4.0</p>
              <p>OPENSTEP 4.2</p>
            </div>
          </div>
          <ul class="hero__facts">
            <li class="hero__fact">Raspberry Pi 4 or 5</li>
            <li class="hero__fact">Raspberry Pi OS Lite, 64 bit</li>
            <li class="hero__fact">NeXTSTEP 2.2 to OPENSTEP 4.2</li>
          </ul>
        </div>
      </div>

      <script>
        (() => {
          const { tl, at, rise } = window.FILM.scene("systems");
          const cues = window.CUES;

          // One system per line, and #roll is one line tall.
          const line = document.getElementById("roll").offsetHeight;

          // The first system rises in, and each of the others rolls up into
          // its place on its own cue, quicker toward the last.
          rise("#roll", cues.systems[0], 40);
          cues.systems.slice(1).forEach((filmTime, index) => {
            tl.to("#roll-strip", { y: -line * (index + 1), duration: 0.12, ease: "expo.out" }, at(filmTime));
          });
          document.querySelectorAll("#systems .hero__fact").forEach((fact, index) => {
            tl.fromTo(fact, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, at(cues.facts[index]));
          });

          window.__timelines["systems"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
