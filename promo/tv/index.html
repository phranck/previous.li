<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1440, height=1080">
    <title>Previously, on a television</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>

    <!-- The film, played on a CRT television. film.mp4 is promo/index.html
         rendered, and `npm run render` in promo/ writes it here before it
         renders this. Its sound plays from the video, so the film's sound is
         defined in one place.

         The tube itself is the HyperFrames CRT treatment on the video: the
         curvature, the scanlines, the slight channel separation, the bloom,
         the vignette and the grain are its canonical controls in
         data-color-grading. What the treatment has no control for is drawn
         over it here: the phosphor stripes, the light on the glass, the hum
         bar rolling through the picture, and the set's bezel around the
         glass. The treatment bends the picture into a cushion with pointed
         corners, and a television's glass has round ones, so the bezel's
         opening is what gives the screen its shape. -->
    <style>
      html,
      body {
        width: 1440px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      #film {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #grille,
      #hum,
      #glass {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* The aperture grille: the red, green and blue phosphor stripes a
         Trinitron tube is made of, one pixel each. */
      #grille {
        background: repeating-linear-gradient(
          90deg,
          rgb(255 60 60) 0 1px,
          rgb(60 255 60) 1px 2px,
          rgb(60 60 255) 2px 3px
        );
        mix-blend-mode: multiply;
        opacity: 0.22;
      }

      /* The bar of slightly brighter picture that rolls down a set whose
         frame rate and the mains beat against each other. */
      #hum {
        top: -30%;
        bottom: auto;
        height: 30%;
        background: linear-gradient(180deg, transparent, rgb(255 255 255 / 6%) 50%, transparent);
        mix-blend-mode: screen;
      }

      /* The glass in front of the phosphor: a soft window light up and to the
         left, a sheen across the curve, and the band of light the top of a
         curved tube catches. */
      #glass {
        background:
          radial-gradient(ellipse 38% 30% at 24% 18%, rgb(255 255 255 / 10%), transparent 70%),
          radial-gradient(ellipse 70% 14% at 50% 9%, rgb(255 255 255 / 7%), transparent 80%),
          linear-gradient(118deg, rgb(255 255 255 / 6%) 0%, transparent 32%);
      }

      #bezel {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-rtu4" id="root" data-composition-id="tv" data-start="0" data-duration="32" data-width="1440" data-height="1080">
      <video data-color-grading="{&quot;preset&quot;:null,&quot;intensity&quot;:1,&quot;adjust&quot;:{&quot;exposure&quot;:0,&quot;contrast&quot;:0,&quot;highlights&quot;:0,&quot;shadows&quot;:0,&quot;whites&quot;:0,&quot;blacks&quot;:0,&quot;temperature&quot;:0,&quot;tint&quot;:0,&quot;vibrance&quot;:0,&quot;saturation&quot;:0},&quot;details&quot;:{&quot;vignette&quot;:0.55,&quot;vignetteMidpoint&quot;:0.5,&quot;vignetteRoundness&quot;:0.3,&quot;vignetteFeather&quot;:0.6,&quot;grain&quot;:0.15,&quot;grainSize&quot;:0.3,&quot;grainRoughness&quot;:0.5},&quot;effects&quot;:{&quot;blur&quot;:0,&quot;pixelate&quot;:0,&quot;chromaBleed&quot;:0.3,&quot;tapeDamage&quot;:0,&quot;tapeTracking&quot;:0,&quot;tapeNoise&quot;:1,&quot;tapeSpeed&quot;:0.5,&quot;filmArtifacts&quot;:0,&quot;halftone&quot;:0,&quot;halftoneSize&quot;:0,&quot;twoInkPrint&quot;:0,&quot;twoInkPrintSize&quot;:0,&quot;ascii&quot;:0,&quot;asciiSize&quot;:0.06578947368421052,&quot;asciiInvert&quot;:0,&quot;asciiStyle&quot;:0,&quot;asciiColor&quot;:1,&quot;asciiRotation&quot;:0,&quot;dither&quot;:0,&quot;ditherSize&quot;:0,&quot;bloom&quot;:0.3,&quot;bloomRadius&quot;:8,&quot;monoScreen&quot;:0,&quot;monoScreenSize&quot;:0,&quot;monoScreenAngle&quot;:0,&quot;monoScreenSpread&quot;:0,&quot;monoScreenShape&quot;:0,&quot;monoScreenInvert&quot;:0,&quot;scanlines&quot;:0.5,&quot;scanlineCount&quot;:0.69,&quot;scanlineSoftness&quot;:1,&quot;chromaticAberration&quot;:0.12,&quot;chromaticAngle&quot;:0,&quot;crtCurvature&quot;:0.28,&quot;digitalGlitch&quot;:0,&quot;digitalGlitchColorSplit&quot;:0,&quot;digitalGlitchLineTear&quot;:0,&quot;digitalGlitchPixelate&quot;:0,&quot;digitalGlitchBlockAmount&quot;:0,&quot;digitalGlitchBlockDisplacement&quot;:0,&quot;digitalGlitchBlockOpacity&quot;:0,&quot;digitalGlitchSpeed&quot;:0,&quot;engraving&quot;:0,&quot;engravingSpacing&quot;:0.4117647058823529,&quot;engravingMinThickness&quot;:0.2,&quot;engravingMaxThickness&quot;:0.4571428571428572,&quot;engravingAngle&quot;:0.25,&quot;engravingContrast&quot;:0.4666666666666667,&quot;engravingSharpness&quot;:0.59,&quot;engravingWave&quot;:0.2,&quot;engravingWaveFrequency&quot;:0.2222222222222222,&quot;crosshatch&quot;:0,&quot;crosshatchSpacing&quot;:0.28,&quot;crosshatchThickness&quot;:0.25,&quot;crosshatchAngle&quot;:0.25,&quot;crosshatchContrast&quot;:0.3333333333333333,&quot;crosshatchEdges&quot;:0.5,&quot;crosshatchLineWeight&quot;:0,&quot;crosshatchWave&quot;:0.33,&quot;crosshatchWaveFrequency&quot;:0.2222222222222222,&quot;kuwahara&quot;:0,&quot;kuwaharaRadius&quot;:0.14285714285714285,&quot;kuwaharaSharpness&quot;:0.3125,&quot;kuwaharaSaturation&quot;:0.5},&quot;lut&quot;:null,&quot;colorSpace&quot;:&quot;rec709&quot;}" data-hf-id="hf-ywgt" id="film" class="clip" src="film.mp4" playsinline data-has-audio="true" data-start="0" data-duration="32" data-track-index="0"></video>
      <div data-hf-id="hf-vap4" id="grille"></div>
      <div data-hf-id="hf-rlzx" id="hum"></div>
      <div data-hf-id="hf-hchb" id="glass"></div>
      <svg id="bezel" viewBox="0 0 1440 1080" aria-hidden="true">
        <defs>
          <!-- Dark plastic, lit a little more from above. -->
          <linearGradient id="bezel-plastic" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#26262b" />
            <stop offset="1" stop-color="#121215" />
          </linearGradient>
          <mask id="bezel-outside">
            <rect width="1440" height="1080" fill="#fff" />
            <path class="bezel-opening" fill="#000" />
          </mask>
          <clipPath id="bezel-inside">
            <path class="bezel-opening" />
          </clipPath>
          <filter id="bezel-soft" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur stdDeviation="9" />
          </filter>
        </defs>
        <rect width="1440" height="1080" fill="url(#bezel-plastic)" mask="url(#bezel-outside)" />
        <!-- The glass sits back from the bezel, so its edge lies in shadow. -->
        <g clip-path="url(#bezel-inside)">
          <path class="bezel-opening" fill="none" stroke="#000" stroke-opacity="0.85" stroke-width="30" filter="url(#bezel-soft)" />
        </g>
        <!-- And the lip of the bezel catches the light. -->
        <path class="bezel-opening" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="2" transform="translate(0 -1)" />
      </svg>
    </div>

    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        const length = Number(document.getElementById("root").dataset.duration);

        // The set plays the whole film and nothing past it. A film rendered
        // at another length, or a video slot that ends elsewhere, would cut it
        // short or leave the set dark, so check is told.
        const film = document.getElementById("film");
        if (Number(film.dataset.duration) !== length) {
          console.error(`The film's slot is ${film.dataset.duration} s and the television ${length} s.`);
        }
        const compare = () => {
          if (Math.abs(film.duration - length) > 0.05) {
            console.error(`film.mp4 runs ${film.duration.toFixed(2)} s and the television ${length} s.`);
          }
        };
        if (film.readyState >= 1) compare();
        else film.addEventListener("loadedmetadata", compare, { once: true });

        // The opening in the bezel: a rectangle with round corners whose
        // sides bow outward a little, as the glass of a tube does. It lies
        // at least ten pixels inside the picture the treatment draws at
        // every point, measured on a bright frame, so no edge of that picture
        // ever shows. Corners first, then how far each side bows.
        const OPENING = { left: 112, top: 92, right: 1328, bottom: 988, radius: 110, bowSide: 20, bowTop: 22 };
        const { left, top, right, bottom, radius, bowSide, bowTop } = OPENING;
        const middle = { x: (left + right) / 2, y: (top + bottom) / 2 };
        const opening = [
          `M ${left + radius} ${top}`,
          `Q ${middle.x} ${top - 2 * bowTop} ${right - radius} ${top}`,
          `A ${radius} ${radius} 0 0 1 ${right} ${top + radius}`,
          `Q ${right + 2 * bowSide} ${middle.y} ${right} ${bottom - radius}`,
          `A ${radius} ${radius} 0 0 1 ${right - radius} ${bottom}`,
          `Q ${middle.x} ${bottom + 2 * bowTop} ${left + radius} ${bottom}`,
          `A ${radius} ${radius} 0 0 1 ${left} ${bottom - radius}`,
          `Q ${left - 2 * bowSide} ${middle.y} ${left} ${top + radius}`,
          `A ${radius} ${radius} 0 0 1 ${left + radius} ${top}`,
          "Z",
        ].join(" ");
        document.querySelectorAll(".bezel-opening").forEach((path) => path.setAttribute("d", opening));

        // The hum bar takes this long to roll from the top of the picture to
        // the bottom, and then starts again, for as long as the film runs.
        const HUM_ROLL = 6;
        tl.fromTo(
          "#hum",
          { yPercent: 0 },
          { yPercent: 450, duration: HUM_ROLL, ease: "none", repeat: Math.max(0, Math.ceil(length / HUM_ROLL) - 1) },
          0,
        );

        window.__timelines["tv"] = tl;
      })();
    </script>
  </body>
</html>
