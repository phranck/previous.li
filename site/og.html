<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Previously, as a link preview</title>
<style>
  /* The link preview and nothing else, at exactly the size a social network
     crops to, for looking at in a browser.

     What it shows is og-image.svg beside it, which site/og-image.py draws.
     Change that and run it again. The picture that actually goes out is
     shots/og.png, and it is rendered from the SVG rather than taken from
     here. og-image.py says how. */
  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  object {
    display: block;
    width: 1200px;
    height: 630px;
  }
</style>
</head>
<body>
  <object type="image/svg+xml" data="og-image.svg" aria-label="The link preview for previous.li"></object>
</body>
</html>
